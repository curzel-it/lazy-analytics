[package]
name = "lazy-analytics"
version = "0.1.0"
edition = "2021"
description = "Tiny self-hosted product analytics: events and sessions in your own SQLite database, with an admin-only dashboard"
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
